# Lint, typecheck, static build, unit tests and integration tests (Postgres + Hasura + Hapi
# via docker compose, with the migrations and metadata applied) on every push and PR.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            tests/package-lock.json
      - run: npm run setup
      - run: npm run check
      - run: npm test
      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
      - if: always()
        run: docker compose down -v
