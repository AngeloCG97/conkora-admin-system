# Artículos de inventario (stock to sell). Sold with the mutation function sell_stock_item (functions.yaml).
table:
  name: stock_item
  schema: public
object_relationships:
  - name: trip
    using:
      foreign_key_constraint_on: trip_id
  - name: currency
    using:
      foreign_key_constraint_on: currency_code
  - name: summary
    using:
      manual_configuration:
        remote_table: { name: stock_item_summary, schema: public }
        column_mapping: { id: stock_item_id }
        insertion_order: null
select_permissions:
  - role: manager
    permission:
      columns: [id, name, description, size, gender, photo_url, price, currency_code, quantity, trip_id, created_at]
      filter: {}
      allow_aggregations: true
insert_permissions:
  - role: manager
    permission:
      check: {}
      columns: [name, description, size, gender, photo_url, price, currency_code, quantity, trip_id]
update_permissions:
  - role: manager
    permission:
      filter: {}
      check: {}
      columns: [name, description, size, gender, photo_url, price, currency_code, quantity, trip_id]
delete_permissions:
  - role: manager
    permission:
      filter: {}
