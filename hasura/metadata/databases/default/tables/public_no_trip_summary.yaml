# View (read-only): one row with Ingreso, cobrado, pendiente, Gastos (with Gastos personales / del negocio subtotals) and Utilidad in USD of General (no Viaje) (Cancelados excluded; 0s when empty).
table:
  name: no_trip_summary
  schema: public
select_permissions:
  - role: manager
    permission:
      columns: [order_count, income_usd, collected_usd, pending_usd, expenses_usd, profit_usd, personal_expenses_usd, business_expenses_usd]
      filter: {}
      allow_aggregations: true
