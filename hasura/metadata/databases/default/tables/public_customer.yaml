table:
  name: customer
  schema: public
object_relationships:
  - name: summary
    using:
      manual_configuration:
        remote_table: { name: customer_summary, schema: public }
        column_mapping: { id: customer_id }
        insertion_order: null
array_relationships:
  - name: trip_summaries
    using:
      manual_configuration:
        remote_table: { name: customer_trip_summary, schema: public }
        column_mapping: { id: customer_id }
        insertion_order: null

  - name: orders
    using:
      foreign_key_constraint_on:
        column: customer_id
        table: { name: order, schema: public }
select_permissions:
  - role: manager
    permission:
      columns: [id, name, phone, email, notes, created_at]
      filter: {}
      allow_aggregations: true
insert_permissions:
  - role: manager
    permission:
      check: {}
      columns: [name, phone, email, notes]
update_permissions:
  - role: manager
    permission:
      filter: {}
      check: {}
      columns: [name, phone, email, notes]
delete_permissions:
  - role: manager
    permission:
      filter: {}
