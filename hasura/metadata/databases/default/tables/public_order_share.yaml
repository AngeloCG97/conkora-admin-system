table:
  name: order_share
  schema: public
object_relationships:
  - name: order
    using:
      foreign_key_constraint_on: order_id
# Public link of a Pedido (issue #35). The token is generated by Postgres (column default): manager inserts
# only order_id. No update permission: "Generar enlace nuevo" deletes the row and inserts a new one.
# No other role has any permission (there is no anonymous role); the public page goes through Hapi.
select_permissions:
  - role: manager
    permission:
      columns: [order_id, token, created_at]
      filter: {}
insert_permissions:
  - role: manager
    permission:
      check: {}
      columns: [order_id]
delete_permissions:
  - role: manager
    permission:
      filter: {}
