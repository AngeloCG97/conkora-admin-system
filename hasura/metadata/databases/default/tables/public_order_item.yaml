table:
  name: order_item
  schema: public
object_relationships:
  - name: order
    using:
      foreign_key_constraint_on: order_id
  - name: summary
    using:
      manual_configuration:
        remote_table: { name: order_item_summary, schema: public }
        column_mapping: { id: order_item_id }
        insertion_order: null
select_permissions:
  - role: manager
    permission:
      columns: [id, order_id, name, price, quantity, size, description, photo_url, created_at]
      filter: {}
      allow_aggregations: true
insert_permissions:
  - role: manager
    permission:
      check: {}
      columns: [order_id, name, price, quantity, size, description, photo_url]
update_permissions:
  - role: manager
    permission:
      filter: {}
      check: {}
      columns: [name, price, quantity, size, description, photo_url]
delete_permissions:
  - role: manager
    permission:
      filter: {}
