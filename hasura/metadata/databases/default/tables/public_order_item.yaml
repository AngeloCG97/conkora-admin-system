table:
  name: order_item
  schema: public
object_relationships:
  - name: order
    using:
      foreign_key_constraint_on: order_id
select_permissions:
  - role: manager
    permission:
      columns: [id, order_id, name, price, quantity, size, photo_url, created_at]
      filter: {}
      allow_aggregations: true
insert_permissions:
  - role: manager
    permission:
      check: {}
      columns: [order_id, name, price, quantity, size, photo_url]
update_permissions:
  - role: manager
    permission:
      filter: {}
      check: {}
      columns: [name, price, quantity, size, photo_url]
delete_permissions:
  - role: manager
    permission:
      filter: {}
