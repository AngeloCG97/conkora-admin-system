table:
  name: trip
  schema: public
array_relationships:
  - name: expenses
    using:
      foreign_key_constraint_on:
        column: trip_id
        table: { name: expense, schema: public }
  - name: rates
    using:
      foreign_key_constraint_on:
        column: trip_id
        table: { name: trip_rate, schema: public }
  - name: orders
    using:
      foreign_key_constraint_on:
        column: trip_id
        table: { name: order, schema: public }
  - name: customer_summaries
    using:
      manual_configuration:
        remote_table: { name: customer_trip_summary, schema: public }
        column_mapping: { id: trip_id }
        insertion_order: null
  - name: expense_categories
    using:
      manual_configuration:
        remote_table: { name: trip_expense_category_summary, schema: public }
        column_mapping: { id: trip_id }
        insertion_order: null
object_relationships:
  - name: summary
    using:
      manual_configuration:
        remote_table: { name: trip_summary, schema: public }
        column_mapping: { id: trip_id }
        insertion_order: null
select_permissions:
  - role: manager
    permission:
      columns: [id, name, destination, start_date, end_date, notes, created_at]
      filter: {}
      allow_aggregations: true
insert_permissions:
  - role: manager
    permission:
      check: {}
      columns: [name, destination, start_date, end_date, notes]
update_permissions:
  - role: manager
    permission:
      filter: {}
      check: {}
      columns: [name, destination, start_date, end_date, notes]
delete_permissions:
  - role: manager
    permission:
      filter: {}
