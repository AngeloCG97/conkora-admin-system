table:
  name: trip
  schema: public
array_relationships:
  - name: expenses
    using:
      foreign_key_constraint_on:
        column: trip_id
        table: { name: expense, schema: public }
  - name: rates
    using:
      foreign_key_constraint_on:
        column: trip_id
        table: { name: trip_rate, schema: public }
select_permissions:
  - role: manager
    permission:
      columns: [id, name, destination, start_date, end_date, notes, created_at]
      filter: {}
      allow_aggregations: true
insert_permissions:
  - role: manager
    permission:
      check: {}
      columns: [name, destination, start_date, end_date, notes]
update_permissions:
  - role: manager
    permission:
      filter: {}
      check: {}
      columns: [name, destination, start_date, end_date, notes]
delete_permissions:
  - role: manager
    permission:
      filter: {}
